<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Ludzie Radia · Goodnight Miami</title>
  <meta name="robots" content="noindex">
  <meta name="theme-color" content="#07060C">
  <meta name="color-scheme" content="dark">
  <link rel="icon" href="/assets/img/favicon.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Mr+Dafoe&family=Bricolage+Grotesque:opsz,wdth,wght@12..96,75..100,300..800&family=Newsreader:ital,opsz,wght@0,6..72,300..600;1,6..72,300..600&display=swap">
  <link rel="stylesheet" href="/assets/css/style.css">
  <link rel="stylesheet" href="/assets/css/soundtrack.css">
  <script src="/assets/js/soundtrack.js" defer></script>
</head>
<body>
<div class="page">
  <header class="station">
    <div class="station__name">
      <span class="onair" aria-hidden="true">ON AIR</span>
      <span>Radio Lighthouse 92.3 FM</span>
    </div>
    <button class="station__now" id="now" type="button" hidden>
      <svg class="i-play" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1l9 5-9 5z" fill="currentColor"/></svg>
      <svg class="i-pause" viewBox="0 0 12 12" aria-hidden="true"><path d="M2 1h3v10H2zM7 1h3v10H7z" fill="currentColor"/></svg>
      <span id="nowTitle"></span>
    </button>
  </header>

  <main>
    <section class="gate" id="gate">
      <h1>Ludzie Radia</h1>
      <p>Twoja postać i jej muzyka. Wpisz hasło, które dostaniesz od autora larpa.</p>
      <form class="unlock" id="unlock">
        <label for="password">Hasło</label>
        <input id="password" type="password" autocomplete="current-password" required>
        <button class="toggle" type="submit">Otwórz</button>
        <p class="error" id="error" role="alert"></p>
      </form>
    </section>

    <article class="sheet" id="sheet" hidden></article>
  </main>

  <template id="cartTpl">
    <figure class="cart">
      <div class="cart__deck">
        <button class="knob" type="button">
          <svg class="i-play" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 5l12 7-12 7z" fill="currentColor"/></svg>
          <svg class="i-pause" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 5h4v14H6zM14 5h4v14h-4z" fill="currentColor"/></svg>
        </button>
        <div class="cart__label">
          <span class="cart__title"></span>
          <span class="cart__artist"></span>
          <span class="cart__lamp" aria-hidden="true">ON AIR</span>
        </div>
        <div class="cart__transport">
          <input class="seek" type="range" min="0" max="1000" value="0" disabled>
          <span class="cart__time" aria-live="polite"></span>
        </div>
      </div>
    </figure>
  </template>

  <footer>
    <p>Treść i utwory udostępnione wyłącznie uczestnikom larpa, do prywatnego odsłuchu.</p>
    <p><a href="/">Wróć do Radia Lighthouse</a></p>
  </footer>
</div>
</body>
</html>
